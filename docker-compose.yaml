services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: bot:latest
    container_name: bot
    restart: unless-stopped
    user: 10001:10001
    env_file:
      - .env
    # Bound to loopback: TLS and public exposure are the reverse proxy's job.
    # Only needed when WEBAPP_ENABLED=true.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bot_data:/opt/app/data

volumes:
  bot_data:
