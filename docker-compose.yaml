services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: bot:latest
    container_name: bot
    restart: unless-stopped
    user: 10001:10001
    env_file:
      - .env
    # Bound to loopback: TLS and public exposure are the reverse proxy's job.
    # Only needed when WEBAPP_ENABLED=true.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bot_data:/opt/app/data

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - bot
    env_file:
      - .env
    # Port 80 is intentionally not published: the Caddyfile disables the
    # HTTP-01 challenge and relies solely on TLS-ALPN-01 over 443.
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bot_data:
  caddy_data:
  caddy_config:
